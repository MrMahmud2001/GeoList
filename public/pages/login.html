<div class="screen" id="screen-login">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><svg viewBox="0 0 20 20"><path d="M10 2C5.6 2 2 5.6 2 10s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm0 2.8l2.4 4.8H7.6L10 4.8zM5.2 11h9.6l-2.4 4H7.6l-2.4-4z"/></svg></div>
      <span class="auth-logo-name">ГИС Дороги</span>
    </div>
    <div class="auth-title">Вход в систему</div>
    <div class="auth-sub">Геоинформационная система управления дорожной инфраструктурой</div>
    <div class="msg-error" id="login-err"></div>
    <label class="field-label" for="login-inp">Логин</label>
    <input class="field-input" id="login-inp" type="text" placeholder="Введите логин" autocomplete="username">
    <label class="field-label" for="login-pass">Пароль</label>
    <input class="field-input" id="login-pass" type="password" placeholder="Введите пароль" autocomplete="current-password">
    <button class="btn-auth btn-auth-primary" id="btn-login" onclick="doLogin()">Войти</button>
    <button class="btn-auth btn-auth-ghost" onclick="showScreen('register')">Нет аккаунта — зарегистрироваться</button>
  </div>
</div>
